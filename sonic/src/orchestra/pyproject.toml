[project]
name = "orchestra"
version = "0.1.0"
description = "Experiment harness"
authors = [{ name = "user", email = "user@example.com" }]
requires-python = ">=3.11,<4.0"
dependencies = [
  "typer>=0.19.2,<0.20.0",
  "rich>=14.2.0,<15.0.0",
]

[project.scripts]
orchestra = "orchestra.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2.2,<9.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
